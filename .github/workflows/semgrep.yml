name: Semgrep

# Semgrep Community Edition (free, no account or token needed).
# Results are uploaded to Security → Code scanning so the
# "Require code scanning results" ruleset rule can use them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep CE
        run: >-
          semgrep scan
          --config p/javascript
          --config p/typescript
          --config p/react
          --config p/secrets
          --metrics=off
          --sarif --output semgrep-results.sarif

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
